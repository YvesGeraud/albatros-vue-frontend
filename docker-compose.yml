# Standalone compose para iterar solo en el frontend, en modo dev (Vite con
# recarga en caliente). No depende de contenedores de backend/db: solo
# necesita algún API alcanzable en VITE_API_BASE_URL (puede ser el backend
# corriendo nativo en el host, o el contenedor `backend` del compose raíz).
name: albatros-frontend

services:
  frontend:
    image: node:22-alpine
    container_name: albatros_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "corepack enable && pnpm install && pnpm run dev -- --host"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  frontend_node_modules:
